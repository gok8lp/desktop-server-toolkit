# --- Bugun sekmesi (gundem-botu konteynerinden, sistem-bakim) ---
- Durum:
    - FLUGEL Akış:
        icon: mdi-alpha-f-circle
        href: http://<IP>:3012
        description: Kişisel sosyal akış — oyun, teknoloji, anime, YouTube, maçlar, AI
    - Sunucu:
        icon: mdi-server-network
        href: http://<IP>:3011/durum
        description: Sorunlar, uyarilar, son bildirimler
        widget:
          type: customapi
          url: http://gundem-botu:8090/sorunlar.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: ogeler
            name: baslik
            label: etiket
            limit: 6
            target: "http://<IP>:3011/durum"
    - Maçlar:
        icon: mdi-basketball
        href: https://www.ankarabasket.org.tr/fiksturler
        description: Hakemlik atamalarin · Super Lig · NBA
        widget:
          type: customapi
          url: http://gundem-botu:8090/maclar.json
          refreshInterval: 300000
          display: dynamic-list
          mappings:
            items: ogeler
            name: baslik
            label: etiket
            limit: 8
            target: "{link}"
    - Takvim:
        icon: mdi-calendar-star
        description: Izledigin animelerin yeni bolumleri ve maclarin
        widget:
          type: calendar
          view: agenda
          maxEvents: 8
          showTime: true
          integrations:
            - type: ical
              url: http://gundem-botu:8090/takvim.ics
              name: Takvim
              color: zinc
- Haberler:
    - Gündem:
        icon: mdi-newspaper-variant-outline
