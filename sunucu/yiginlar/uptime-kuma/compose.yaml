version: "3.8"
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - /arrapps/uptime-kuma:/app/data:Z
      - /var/run/docker.sock:/var/run/docker.sock # Docker konteynerlerini otomatik bulması için
    ports:
      - 3004:3001
    restart: unless-stopped