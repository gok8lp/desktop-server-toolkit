services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Istanbul
      - N8N_HOST=<IP>
      - N8N_PORT=5678
      - WEBHOOK_URL=http://<IP>:5678
      - N8N_SECURE_COOKIE=false
    volumes:
      - /arrapps/n8n:/home/node/.n8n
    ports:
      - 5678:5678 # Dışarıdan 5678'den girip, içerideki 5678'e bağlanmalısın
networks: {}
