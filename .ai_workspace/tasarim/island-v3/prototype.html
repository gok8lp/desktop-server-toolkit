<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FLUGEL Island v3 — hareket prototipi</title>
  <style>
    :root{color-scheme:dark;--ink:#08090b;--surface:#14161a;--raised:#202329;--line:rgba(255,255,255,.11);--text:#f5f6f7;--sub:#a7abb2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0e12;color:var(--text);font:14px system-ui,sans-serif}.stage{height:min(750px,calc(100vh - 140px));min-height:540px;margin:24px;border:1px solid #333c48;border-radius:17px;background:radial-gradient(circle at 50% 20%,#303b4b,#161d27 70%);overflow:hidden;position:relative}.bar{height:8px;background:#07080a}.shell{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:196px;height:34px;border-radius:0 0 18px 18px;border:1px solid var(--line);border-top:0;background:var(--ink);overflow:hidden;transition:width 320ms cubic-bezier(.2,.75,.2,1),height 320ms cubic-bezier(.2,.75,.2,1),border-radius 320ms cubic-bezier(.2,.75,.2,1);z-index:2}.shell.peek{width:340px;height:56px;border-radius:0 0 21px 21px}.shell.open{width:min(720px,calc(100% - 28px));height:min(570px,calc(100% - 25px));border-radius:0 0 24px 24px}.top{height:34px;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer}.top:focus-visible{outline:2px solid #d5dce7;outline-offset:-3px}.top .time{font-size:13px;font-weight:750;font-variant-numeric:tabular-nums}.top .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:650}.top .meta{font-size:11px;color:var(--sub)}.cover{height:18px;width:18px;background:#aeb8c5;border-radius:5px;flex:none}.peekline{height:22px;margin:0 14px;display:flex;align-items:center;gap:10px;color:var(--sub);font-size:11px;opacity:0;transform:translateY(-4px);transition:opacity 170ms ease-out,transform 170ms ease-out}.shell.peek .peekline{opacity:1;transform:translateY(0)}.peekline .progress{height:3px;background:#4b535e;border-radius:4px;flex:1;max-width:130px}.peekline .progress:before{content:"";display:block;width:63%;height:100%;border-radius:4px;background:#e8edf2}.peekline .control{border:0;background:none;color:var(--text);font:inherit;padding:3px 5px;cursor:pointer}.card{padding:14px 16px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity 190ms ease-out,transform 190ms ease-out}.shell.open .card{opacity:1;transform:translateY(0);pointer-events:auto}.cardhead{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.cardhead b{font-size:25px;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.cardhead small{display:block;color:var(--sub);font-size:11px}.close{background:var(--raised);border:1px solid var(--line);border-radius:10px;color:var(--text);height:36px;width:36px;cursor:pointer}.activity{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px;margin:12px 0}.activity span:nth-child(2){flex:1}.activity small{color:var(--sub)}.rail{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}.rail button{flex:1;border:0;border-radius:10px;background:transparent;color:var(--sub);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:background 170ms ease-out,color 170ms ease-out}.rail button.active{background:var(--raised);color:var(--text)}.rail img{width:18px;height:18px;filter:brightness(0) invert(1)}.content{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:160px;margin-top:12px;padding:14px;opacity:1;transform:translateY(0);transition:opacity 150ms ease-out,transform 150ms ease-out}.content.switching{opacity:0;transform:translateY(4px)}.content h2{margin:0 0 9px;font-size:12px}.content p{color:var(--sub);font-size:11px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:9px 12px;font-size:11px}.controls{margin:0 24px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls button{background:#202630;border:1px solid #39414c;border-radius:10px;color:var(--text);padding:9px 13px;cursor:pointer}.controls button:hover{background:#303948}.hint{color:var(--sub);font-size:11px;margin-left:8px}@media(max-width:620px){.stage{margin:10px;height:690px}.shell.open{height:610px}.rail button{font-size:10px}.controls{margin:0 10px 10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0.01ms!important;animation-duration:0.01ms!important}}
  </style>
</head>
<body>
  <div class="stage"><div class="bar"></div><section class="shell" id="shell" aria-label="FLUGEL Island hareket prototipi">
    <div class="top" id="top" role="button" tabindex="0" aria-label="Island kartını aç"><span class="cover" id="cover" hidden></span><span class="grow" id="primary">21:53</span><span class="meta" id="secondary">%84</span></div>
    <div class="peekline" id="peek"><span id="peektext">Hızlı bakış</span><span class="progress"></span><button class="control" type="button" aria-label="Oynat veya duraklat">Ⅱ</button></div>
    <div class="card"><div class="cardhead"><div><small>Açık hava · 19°</small><b>21:53</b><small>18 Ekim Pazar</small></div><button class="close" type="button" id="close" aria-label="Kapat">×</button></div>
      <div class="activity"><span class="cover"></span><span><b id="activitytitle">Günlük durum</b><br><small id="activitysub">Tüm bilgiler hazır</small></span><small id="activitymore">+2 daha</small></div>
      <nav class="rail" aria-label="Gruplar"><button class="active" type="button" data-group="ana"><img src="ikon/ana-mono.svg" alt="">Ana</button><button type="button" data-group="sistem"><img src="ikon/sistem-mono.svg" alt="">Sistem</button><button type="button" data-group="icerik"><img src="ikon/icerik-mono.svg" alt="">İçerik</button><button type="button" data-group="takip"><img src="ikon/takip-mono.svg" alt="">Takip</button><button type="button" data-group="bildirim"><img src="ikon/bildirim-mono.svg" alt="">Bildirim</button></nav>
      <div class="content" id="content"><h2>Ana</h2><p>İşlevler korunur; yalnız ilk bakış sadeleşir.</p><div class="chips"><span class="chip">Ses</span><span class="chip">Parlaklık</span><span class="chip">Wi‑Fi</span><span class="chip">Tüm araçlar →</span></div></div>
    </div>
  </section></div>
  <div class="controls"><button type="button" data-event="idle">Boş</button><button type="button" data-event="media">Medya</button><button type="button" data-event="notice">Bildirim</button><button type="button" data-event="warning">Sistem uyarısı</button><span class="hint">Kapsül üstüne gel: kısa bakış · Tıkla: kart · ESC: kapat. Hareketler sürekli döngü değildir.</span></div>
  <script>
    const shell=document.getElementById('shell');
    const top=document.getElementById('top');
    const primary=document.getElementById('primary');
    const secondary=document.getElementById('secondary');
    const peektext=document.getElementById('peektext');
    const cover=document.getElementById('cover');
    const activitytitle=document.getElementById('activitytitle');
    const activitysub=document.getElementById('activitysub');
    const content=document.getElementById('content');
    const states={idle:['21:53','%84','Günlük durum','Tüm bilgiler hazır','Sistem hazır',false],media:['Gece Yolu','2:14','Gece Yolu','FLUGEL Oynatıcı · Çalıyor','Medya · 2:14',true],notice:['Yeni bildirim','+2','Bildirimler','İki yeni bildirim','Bildirim · 2 yeni',false],warning:['Sunucu uyarısı','!','Sunucu','Bağlantı kontrol ediliyor','Sunucu durumu',false]};
    let current='idle';
    function event(name){current=name;const s=states[name];primary.textContent=s[0];secondary.textContent=s[1];activitytitle.textContent=s[2];activitysub.textContent=s[3];peektext.textContent=s[4];cover.hidden=!s[5]}
    function open(){shell.classList.remove('peek');shell.classList.add('open');top.setAttribute('aria-label','Island kartı açık')}
    function close(){shell.classList.remove('open','peek');top.setAttribute('aria-label','Island kartını aç')}
    top.addEventListener('click',open);
    top.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
    shell.addEventListener('mouseenter',()=>{if(!shell.classList.contains('open'))shell.classList.add('peek')});
    shell.addEventListener('mouseleave',()=>{if(!shell.classList.contains('open'))shell.classList.remove('peek')});
    document.getElementById('close').addEventListener('click',e=>{e.stopPropagation();close();top.focus()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    document.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>event(b.dataset.event)));
    const groupNames={ana:'Ana',sistem:'Sistem',icerik:'İçerik',takip:'Takip',bildirim:'Bildirim'};
    const groupItems={ana:['Hızlı','Kısayollar'],sistem:['Sistem','Sanal makineler'],icerik:['Akış','Anime ve manga','Oyunlar'],takip:['Maçlar','Kripto ve döviz'],bildirim:['Bildirimler']};
    document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-group]').forEach(x=>x.classList.toggle('active',x===b));const id=b.dataset.group;content.classList.add('switching');setTimeout(()=>{content.innerHTML='<h2>'+groupNames[id]+'</h2><p>Mevcut sayfalar tek bir grupta; içerik kaybolmaz.</p><div class="chips">'+groupItems[id].map(x=>'<span class="chip">'+x+'</span>').join('')+'</div>';content.classList.remove('switching')},90)}));
    event('idle');
  </script>
</body>
</html>
